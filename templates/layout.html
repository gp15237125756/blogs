<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="author" content="{{author}}" />
  <link rel="canonical" href="{{canonical}}" />
  <meta property="og:site_name" content="{{siteTitle}}" />
  <meta property="og:title" content="{{pageTitle}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:type" content="{{ogType}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="{{base}}assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}feed.xml" />
  <link rel="stylesheet" href="{{base}}assets/css/style.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('blog-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* 忽略隐私模式下的异常 */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <div class="reading-progress" id="reading-progress" hidden></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{base}}index.html">
        <span class="brand-mark" aria-hidden="true">{{brandMark}}</span>
        <span class="brand-text">
          <strong>{{siteTitle}}</strong>
          <em>{{tagline}}</em>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="展开菜单">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a class="nav-link{{navHome}}" href="{{base}}index.html">首页</a>
        <a class="nav-link{{navArchive}}" href="{{base}}archive.html">归档</a>
        <a class="nav-link{{navTags}}" href="{{base}}tags.html">标签</a>
        <a class="nav-link{{navAbout}}" href="{{base}}about.html">关于</a>
        <span class="nav-actions">
          <button class="icon-btn js-search-open" type="button" aria-label="搜索文章（快捷键 /）" title="搜索文章（/）">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <button class="icon-btn js-theme-toggle" type="button" aria-label="切换深浅色主题" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8" />
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <line x1="12" y1="2.5" x2="12" y2="5" />
                <line x1="12" y1="19" x2="12" y2="21.5" />
                <line x1="2.5" y1="12" x2="5" y2="12" />
                <line x1="19" y1="12" x2="21.5" y2="12" />
                <line x1="5.3" y1="5.3" x2="7" y2="7" />
                <line x1="17" y1="17" x2="18.7" y2="18.7" />
                <line x1="5.3" y1="18.7" x2="7" y2="17" />
                <line x1="17" y1="7" x2="18.7" y2="5.3" />
              </g>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            </svg>
          </button>
        </span>
      </nav>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-copy">© <span id="footer-year">2026</span> {{author}} · 由 zero-dep 静态生成器驱动</p>
      <p class="footer-links">
        <a href="{{repoUrl}}" target="_blank" rel="noopener noreferrer">Gitee 仓库</a>
        <a href="{{base}}feed.xml">RSS</a>
        <a href="{{base}}sitemap.xml">Sitemap</a>
        <a href="mailto:{{email}}">邮件</a>
      </p>
    </div>
  </footer>

  <button class="back-to-top js-back-to-top" type="button" aria-label="回到顶部" title="回到顶部" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="search-modal" id="search-modal" hidden>
    <div class="search-backdrop js-search-close"></div>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索文章">
      <div class="search-head">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <input id="search-input" type="search" placeholder="搜索标题、标签或正文…" autocomplete="off" spellcheck="false" />
        <kbd>Esc</kbd>
      </div>
      <ul class="search-results" id="search-results"></ul>
      <p class="search-hint" id="search-hint">输入关键词开始搜索</p>
    </div>
  </div>

  <script src="{{base}}assets/js/main.js" defer></script>
</body>
</html>
